<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Browser AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
      background: linear-gradient(135deg, #e0eafc, #cfdef3); padding: 16px;
    }
    .glass {
      width: 100%; max-width: 680px; height: 85vh; display: flex; flex-direction: column;
      background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08); overflow: hidden;
    }
    header { padding: 18px 24px; border-bottom: 1px solid rgba(0,0,0,0.06); }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; color: #111; }
    #status { font-size: 12px; color: #555; margin-top: 4px; }
    #chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #111; color: #fff; }
    .ai { align-self: flex-start; background: rgba(255,255,255,0.85); color: #111; }
    form { display: flex; gap: 10px; padding: 16px; border-top: 1px solid rgba(0,0,0,0.06); }
    input { flex: 1; padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.12); outline: none; font-size: 14px; }
    button { padding: 12px 20px; border-radius: 14px; border: none; background: #111; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="glass">
    <header>
      <h1>My Free AI</h1>
      <div id="status">Checking WebGPU & loading model...</div>
    </header>
    <div id="chat"></div>
    <form id="form">
      <input id="prompt" placeholder="Ask anything..." disabled required />
      <button id="send" type="submit" disabled>Send</button>
    </form>
  </div>

  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    const statusEl = document.getElementById("status");
    const chatEl = document.getElementById("chat");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");

    // Swap this ID for any prebuilt WebLLM model (e.g., Qwen2.5-3B, Gemma-2-2b)
    const MODEL_ID = "Llama-3.2-3B-Instruct-q4f16_1-MLC";

    const messages = [
      { role: "system", content: "You are a helpful, concise AI assistant." }
    ];

    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    if (!navigator.gpu) {
      statusEl.textContent = "WebGPU isn't supported in this browser. Try Chrome or Edge on desktop/Android.";
      throw new Error("No WebGPU");
    }

    const engine = await webllm.CreateMLCEngine(MODEL_ID, {
      initProgressCallback: (report) => {
        statusEl.textContent = report.text;
      }
    });

    statusEl.textContent = `Ready • Running locally on your GPU (${MODEL_ID})`;
    promptEl.disabled = false;
    sendBtn.disabled = false;

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = promptEl.value.trim();
      if (!text) return;

      promptEl.value = "";
      promptEl.disabled = true;
      sendBtn.disabled = true;

      addBubble("user", text);
      messages.push({ role: "user", content: text });
      const aiBubble = addBubble("ai", "...");

      let reply = "";
      const chunks = await engine.chat.completions.create({
        messages,
        stream: true,
        temperature: 0.7,
      });

      for await (const chunk of chunks) {
        reply += chunk.choices[0]?.delta?.content || "";
        aiBubble.textContent = reply;
        chatEl.scrollTop = chatEl.scrollHeight;
      }

      messages.push({ role: "assistant", content: reply });
      promptEl.disabled = false;
      sendBtn.disabled = false;
      promptEl.focus();
    });
  </script>
</body>
</html>
